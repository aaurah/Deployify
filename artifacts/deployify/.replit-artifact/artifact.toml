kind = "web"
previewPath = "/"
title = "Deployify — Deployment Platform"
version = "1.0.0"
id = "artifacts/deployify"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23043

[services.development]
run = "pnpm --filter @workspace/deployify run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/deployify", "run", "build" ]
publicDir = "artifacts/deployify/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23043"
BASE_PATH = "/"
